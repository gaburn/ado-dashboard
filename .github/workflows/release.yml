# PyPI Release Workflow — Trusted Publishing (OIDC)
#
# SETUP REQUIRED (one-time, on PyPI side):
#   Before this workflow can publish, you must configure PyPI Trusted Publishing:
#   https://docs.pypi.org/trusted-publishers/
#
#   On PyPI → your project → Publishing → "Add a new publisher":
#     Owner:      gaburn
#     Repository: ado-dashboard
#     Workflow:   release.yml
#     Environment: pypi   (matches the `environment:` key below)
#
#   No API tokens or secrets are needed after that — OIDC handles authentication.
#
# TRIGGERING A RELEASE:
#   Push an annotated version tag:
#     git tag -a v0.2.1 -m "Release v0.2.1"
#     git push origin v0.2.1
#
# The workflow will build wheel + sdist, publish to PyPI, and create a GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create GitHub Releases
  id-token: write   # needed for OIDC / Trusted Publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git describe works

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC — no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ado-dashboard ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
