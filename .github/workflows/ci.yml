name: CI

on:
  push:
    branches: [dev, main, 'release/*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/

      - name: Run tests (pytest)
        run: pytest -q

      # TODO: requires pytest-cov in [dev] extras (Glóin owns pyproject.toml).
      # Bridge install until pyproject is updated.
      - name: Coverage gate (soft-fail until threshold is raised)
        shell: bash
        run: |
          pip install pytest-cov --quiet
          pytest --cov=ado_dashboard --cov-report=term --cov-fail-under=60 -q || \
            echo "::warning::Coverage below 60% threshold — fix before raising the gate"

  guard-no-squad-on-main:
    # Squad framework files (AI agent scaffolding) must never land on main.
    # Runs on direct pushes to main and on PRs targeting main.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any Squad files are tracked
        shell: bash
        run: |
          set -e
          # Patterns that must NOT exist on main (per .gitignore policy).
          PATTERNS=(
            '.squad/'
            '.github/agents/squad.agent.md'
            '.github/workflows/squad-'
            '.github/workflows/sync-squad-labels.yml'
          )
          FOUND=$(git ls-files | grep -E '^(\.squad/|\.github/agents/squad\.agent\.md|\.github/workflows/squad-|\.github/workflows/sync-squad-labels\.yml)' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Squad framework files detected on main branch:"
            echo "$FOUND" | sed 's/^/  - /'
            echo ""
            echo "Squad scaffolding lives only on the dev branch."
            echo "To fix: git rm -r --cached <paths>; git commit; push."
            exit 1
          fi
          echo "✅ No Squad files tracked on main."
