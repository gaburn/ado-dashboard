[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wip-dashboard"
version = "0.2.0"
description = "Interactive terminal dashboard for Azure DevOps PRs and work items"
requires-python = ">=3.12"
dependencies = [
    "textual>=3.0.0",
]

[project.scripts]
wip-dashboard = "wip_dashboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wip_dashboard"]
