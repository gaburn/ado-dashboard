[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ado-dashboard"
version = "0.2.1"
description = "Interactive terminal dashboard for Azure DevOps PRs and work items"
requires-python = ">=3.12"
dependencies = [
    "textual>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ado-dashboard = "ado_dashboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ado_dashboard"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter when adopted
